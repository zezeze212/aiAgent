spring:
  datasource:
    url: "jdbc:h2:mem:ai_agent_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1"
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  ai:
    model:
      chat: openai
      embedding: none

    vectorstore:
      type: none

    openai:
      api-key: test-only-not-used
      base-url: http://localhost
      chat:
        options:
          model: test-model
          extra-body:
            thinking:
              type: disabled

# 必须是顶层配置，不能放在 spring.ai 下面。
agent:
  rag:
    mode: rule
    vector:
      enabled: false

deepseek:
  api-key: test-only-not-used
  model: test-model