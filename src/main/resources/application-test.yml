spring:
  datasource:
    url: "jdbc:h2:mem:ai_agent_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1"
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  ai:
    model:
      chat: openai
      embedding: none

    vectorstore:
      type: none

    openai:
      api-key: test-only-not-used
      base-url: http://localhost
      chat:
        options:
          model: test-model
          extra-body:
            thinking:
              type: disabled

# 必须是顶层配置，不能放在 spring.ai 下面。
agent:
  task:
    sweep-enabled: false
    startup-recovery-enabled: false

  rag:
    mode: rule
    vector:
      enabled: false

  models:
    autodl:
      # 避免开发机环境变量导致普通上下文测试依赖云端配置。
      enabled: false