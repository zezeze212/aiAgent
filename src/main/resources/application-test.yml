spring:
  datasource:
    url: "jdbc:h2:mem:ai_agent_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1"
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  ai:
    model:
      chat: openai
      embedding: none

    openai:
      api-key: test-only-not-used
      base-url: http://localhost
      chat:
        options:
          model: test-model

deepseek:
  api-key: test-only-not-used
  model: test-model