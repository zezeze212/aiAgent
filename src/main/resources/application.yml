server:
  port: 8088

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  ai:
    model:
      chat: openai
      embedding: ollama

    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
          extra-body:
            thinking:
              type: disabled

    ollama:
      base-url: ${AI_AGENT_OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${AI_AGENT_EMBEDDING_MODEL:bge-m3:latest}

    vectorstore:
      type: qdrant
      qdrant:
        host: ${AI_AGENT_QDRANT_HOST:localhost}
        port: ${AI_AGENT_QDRANT_GRPC_PORT:6334}
        collection-name: ${AI_AGENT_QDRANT_COLLECTION:ai_agent_knowledge_managed_v1}
        use-tls: false
        initialize-schema: true

    tools:
      throw-exception-on-error: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true


agent:
  max-execution-time-ms: 120000

  tool-governance:
    allowed-permissions:
      - DATABASE_METADATA_READ
      - LOCAL_DIAGNOSTIC_ANALYZE

    max-risk-level: LOW
    allow-side-effect-tools: false

  rag:
    # 正式 /agent/ask：rule、vector、bm25、hybrid。
    # 默认继续使用 vector；切换后重启应用生效。
    mode: ${AI_AGENT_RAG_MODE:vector}
    top-k: 5

    context:
      max-chunks: 5
      max-chunk-chars: 2000
      max-total-chars: 6000

      # 请求级单来源片段上限；0 关闭，正数启用。
      # 来源分散不保证回答更好，因此默认保持原有选择行为。
      max-chunks-per-source: ${AI_AGENT_CONTEXT_MAX_CHUNKS_PER_SOURCE:0}

    # 正式 /agent/ask 的重排开关，与 Benchmark 开关独立。
    rerank:
      enabled: ${AI_AGENT_MAIN_RERANK_ENABLED:false}
      api-key: ${SILICONFLOW_API_KEY:}
      # 当前项目的初始等待策略，不代表整个 Agent 的总超时。
      request-timeout-ms: ${AI_AGENT_MAIN_RERANK_TIMEOUT_MS:3000}

    # 正式 Agent 首次检索的查询改写；默认关闭。
    query-rewrite:
      enabled: ${AI_AGENT_QUERY_REWRITE_ENABLED:false}

      # 改写客户端的 HTTP 读取超时，不是整个 Agent 的总超时。
      read-timeout-ms: ${AI_AGENT_QUERY_REWRITE_READ_TIMEOUT_MS:5000}

    benchmark:
      enabled: true

      # 重排会调用外部模型服务，实验时显式开启。
      rerank-enabled: ${AI_AGENT_RERANK_ENABLED:false}

      # 从启动 Java 进程的环境读取，不在配置文件中写真实 Key。
      rerank-api-key: ${SILICONFLOW_API_KEY:}

      # 查询改写成对比较接口；要求正式 Hybrid 和正式改写器已启用。
      rewrite-enabled: ${AI_AGENT_QUERY_REWRITE_BENCHMARK_ENABLED:false}

    vector:
      enabled: true
      # 本单元先保留宽松对照；不是已经校准好的拒答阈值。
      similarity-threshold: 0.0

      # 基础检索范围，由服务端配置。
      scope:
        category: mysql
        visibility: public

      # 同名 Embedding 模型权重发生变化时，需要更新此标识。
      embedding-revision: bge-m3-local-v1
      # 相对于 Java 进程工作目录；IDEA 运行目录保持为项目根目录。
      state-directory: ./data/knowledge-index
      qdrant-rest-url: http://localhost:6333