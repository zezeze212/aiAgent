server:
  port: 8088

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  ai:
    model:
      chat: openai
      embedding: none

    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
          extra-body:
            thinking:
              type: disabled

    tools:
      throw-exception-on-error: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 旧 WebClient 调用链继续使用这组配置。
deepseek:
  api-key: ${DEEPSEEK_API_KEY}
  base-url: https://api.deepseek.com
  model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
  timeout-ms: 30000

agent:
  max-execution-time-ms: 120000

  tool-governance:
    allowed-permissions:
      - DATABASE_METADATA_READ
      - LOCAL_DIAGNOSTIC_ANALYZE

    max-risk-level: LOW
    allow-side-effect-tools: false